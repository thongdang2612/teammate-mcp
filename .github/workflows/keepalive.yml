name: Keep Render warm

# Free-tier Render web services spin down after ~15 min of inactivity; the next
# request then waits ~30-60s for a cold start, which exceeds Diaflow's tool-call
# timeout ("connected but tool times out"). Pinging the PUBLIC OAuth discovery
# endpoint (no auth, returns 200) on a tight schedule keeps the instance awake.
#
# PRIMARY keepalive is an EXTERNAL monitor, NOT this workflow. GitHub-hosted cron
# is best-effort and heavily throttled: a "*/10" schedule is silently coalesced to
# roughly hourly (or worse) under load, so it CANNOT keep a 15-min-spindown service
# warm. Set up a free external pinger hitting the same URL every 5 min:
#   - cron-job.org: New cronjob → URL below → "Every 5 minutes" → save.
#   - or UptimeRobot: HTTP(s) monitor → same URL → 5-min interval (free-tier min).
#   Use a generous request timeout (~60-90s) so a single ping rides out a cold start.
#
# This workflow is now a BACKUP only: an hourly best-effort schedule (which GitHub
# honors far more reliably than sub-hourly) plus manual runs. It reduces, but does
# not eliminate, cold starts on its own. For zero spin-down use Render's paid tier.
# - Change PING_URL if the deploy host changes.
# - Scheduled workflows auto-disable after 60 days with no repo activity.

on:
  schedule:
    - cron: "0 * * * *"       # hourly (UTC) — best-effort backup; external monitor is primary
  workflow_dispatch: {}       # allow manual runs from the Actions tab

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      PING_URL: https://teammate-mcp.onrender.com/.well-known/oauth-protected-resource/mcp
    steps:
      - name: Ping to keep the MCP server warm
        run: |
          set -euo pipefail
          code=""
          for attempt in 1 2 3; do
            # --max-time 90 lets a single request ride out a cold start (Render
            # holds the connection while the instance wakes, then returns 200).
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 "$PING_URL" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            [ "$code" = "200" ] && break
            sleep 15
          done
          if [ "$code" != "200" ]; then
            echo "::error::keepalive ping failed (last status: $code)"
            exit 1
          fi
