# Render Blueprint — deploys the Dockerfile as a free web service.
# In Render: New → Blueprint → connect this repo. Set the sync:false vars in the dashboard.
# Render injects $PORT, which config.ts prefers over MCP_HTTP_PORT.
services:
  - type: web
    name: teammate-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - key: MCP_TRANSPORT
        value: http
      # Dev backend serves the agents API AND the magic-auth login endpoints;
      # prod (api.diaflow.io) does not expose /auth/magic-auth/* so oauth login 404s there.
      - key: DIAFLOW_API_BASE
        value: https://api-dev.diaflow.io
      - key: MCP_AUTH_MODE
        value: oauth
      # Set these in the Render dashboard (Environment). MCP_PUBLIC_URL is the
      # onrender.com URL + /mcp — fill it after the first deploy reveals the host.
      - key: MCP_PUBLIC_URL
        sync: false
      # DIAFLOW_TOKEN/MCP_INBOUND_TOKEN are unused while MCP_AUTH_MODE=oauth; kept as a
      # fallback in case the service is switched back to static mode.
      - key: MCP_INBOUND_TOKEN
        sync: false
      - key: DIAFLOW_TOKEN
        sync: false
      - key: DIAFLOW_WORKSPACE_ID
        sync: false
